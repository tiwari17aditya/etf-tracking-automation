name: CI / CD Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Validate Python Backend & Endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Import Integrity
        run: |
          python -c "import yfinance, pandas, starlette, core.ui_server; print('Core modules successfully loaded!')"

      - name: Test Candle & Indicator Endpoints
        run: |
          python -c "
          import asyncio
          from core.ui_server import api_candles
          class DummyReq:
              query_params = {'symbol': 'GOLDBEES.NS', 'period': '1mo'}
          resp = asyncio.run(api_candles(DummyReq()))
          import json
          data = json.loads(resp.body.decode())
          assert data.get('count', 0) > 0, 'No candles returned'
          print('Candles endpoint verified with count:', data['count'])
          "
